name: iOS build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  build:
    name: Unsigned iOS build
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST}" ]; then
            printf '%s' "${GOOGLE_SERVICE_INFO_PLIST}" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST is not set, building without Firebase."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Remove the secrets from the runner
        if: always()
        run: rm -f ios/Runner/GoogleService-Info.plist
